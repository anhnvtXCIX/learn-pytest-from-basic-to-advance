# For manual poking (psql, redis-cli) and for running the app locally with `uvicorn`.
# The test suite does NOT use this -- modules/10-testcontainers spins up its own
# throwaway Postgres/Redis per test session so the suite stays self-contained and
# reproducible in CI. See modules/10-testcontainers/README.md.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
